    <style type="text/tailwindcss">
        @layer components {
            .card { @apply bg-white rounded-2xl border border-sand/40 shadow-[0_1px_3px_rgba(135,98,76,.07)]; }
            .btn { @apply inline-flex items-center justify-center gap-1.5 rounded-xl px-4 py-2 text-sm font-semibold transition active:scale-[.98] disabled:opacity-50 disabled:cursor-not-allowed whitespace-nowrap; }
            .btn-primary { @apply bg-cocoa text-white hover:bg-[#755340]; }
            .btn-soft { @apply bg-sand/40 text-cocoa hover:bg-sand/70; }

    <style>
        body {
            font-family: Cairo, Helvetica, Arial, sans-serif;
        }

        .title {
            font-family: Helvetica, Arial, Cairo, sans-serif;
            letter-spacing: .2px;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px
        }

        ::-webkit-scrollbar-thumb {
            background: #DEC8AF;
            border-radius: 8px
        }

        .tiana-word {
            font-family: 'Sacramento', cursive;
            color: #D3A59F;
            font-size: 2.6em;
            line-height: 1;
            position: relative;
            padding: 0 .15em;
        }

        .tiana-word i {
            position: absolute;
            font-style: normal;
            color: #B88B62;
            font-size: .28em;
            top: .38em;
            left: .95em;
        }

        #printArea {
            display: none
        }

        @media print {
            body>*:not(#printArea) {
                display: none !important
            }

            #printArea {
                display: block !important
            }

            body {
                background: #fff !important
            }

            @page {
                margin: 8mm
            }

            .no-print {
                display: none !important
            }
        }

        /* landing page */
        .lp {
            --lp: #B88B62;
            font-family: Cairo, Helvetica, sans-serif;
            background: #FFFCF9;
            color: #44342b;
        }

        .lp-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
            gap: 16px;
        }

        .lp-hero {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 28px;
            padding: 44px 26px;
            background: linear-gradient(135deg, #F7EDE2, #F4DDD9);
        }

        .lp-hero>div {
            flex: 1 1 270px;
        }

        .lp-btn {
            background: var(--lp);
            color: #fff;
            padding: 11px 26px;
            border-radius: 999px;
            font-weight: 700;
            display: inline-block;
            cursor: pointer;
            border: 0;
        }

        .lp-btn:hover {
            filter: brightness(.94)
        }

        .lp-sec {
            padding: 40px 26px;
        }

        .lp-card {
            background: #fff;
            border: 1px solid #efe4d6;
            border-radius: 18px;
            overflow: hidden;
            transition: .2s;
        }

        .lp-card:hover {
            box-shadow: 0 8px 24px rgba(135, 98, 76, .14);
            transform: translateY(-2px);
        }

        .lp-chip {
            border: 1px solid #e6d6c3;
            background: #fff;
            border-radius: 999px;
            padding: 6px 16px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .lp-chip.on {
            background: var(--lp);
            color: #fff;
            border-color: var(--lp);
        }
    </style>
</head>

    <script>

        const UI = {

        function exportCSV(name, cols, rows) {
            const csv = [cols.map(c => c.h).join(',')].concat(rows.map(r => cols.map(c => '"' + String(c.v(r) ?? '').replace(/"/g, '""') + '"').join(','))).join('\n');
            download(name + '.csv', '\ufeff' + csv, 'text/csv;charset=utf-8');
        }
        function readImage(file, max = 700, type = 'image/jpeg') {
            return new Promise(res => {
                const r = new FileReader(); r.onload = () => {
                    const im = new Image(); im.onload = () => {
                        const k = Math.min(1, max / Math.max(im.width, im.height)); const c = document.createElement('canvas'); c.width = im.width * k; c.height = im.height * k;
                        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL(type, .85));
                    }; im.src = r.result;
                }; r.readAsDataURL(file);
            });
        }

        /* ---------- modal ---------- */
        function modal(title, body, { size = 'md', footer = '' } = {}) {
            const w = { sm: 'max-w-md', md: 'max-w-2xl', lg: 'max-w-4xl', xl: 'max-w-6xl' }[size];
            const el = document.createElement('div');
            el.className = 'modal fixed inset-0 z-[90] flex items-end sm:items-center justify-center sm:p-4';
            el.innerHTML = `<div class="absolute inset-0 bg-stone-900/40" data-action="closeModal"></div>
  <div class="relative bg-white w-full ${w} rounded-t-3xl sm:rounded-3xl shadow-2xl max-h-[92vh] flex flex-col">
    <div class="flex items-center justify-between px-5 py-3.5 border-b border-sand/40"><h3 class="title font-extrabold text-lg text-cocoa">${title}</h3><button class="btn btn-ghost !px-2.5" data-action="closeModal">✕</button></div>

    ${footer ? `<div class="px-5 py-3.5 border-t border-sand/40 flex flex-wrap gap-2 justify-end bg-[#FDFBF8] rounded-b-3xl">${footer}</div>` : ''}
  </div>`;
            $('#modalRoot').appendChild(el); return el;
        }
        function closeTopModal() { const m = $$('#modalRoot .modal'); if (m.length) { if (window.__scanStop) { window.__scanStop(); window.__scanStop = null; } m[m.length - 1].remove(); } }
        const toggle = (checked, attrs) => `<label class="relative inline-flex cursor-pointer align-middle"><input type="checkbox" class="sr-only peer" ${checked ? 'checked' : ''} ${attrs}><div class="w-10 h-6 bg-stone-200 rounded-full peer-checked:bg-caramel transition after:content-[''] after:absolute after:top-0.5 after:start-0.5 after:w-5 after:h-5 after:bg-white after:rounded-full after:shadow after:transition peer-checked:after:-translate-x-4"></div></label>`;

        /* ---------- EAN-13 barcode ---------- */
        const EAN_L = ['0001101', '0011001', '0010011', '0111101', '0100011', '0110001', '0101111', '0111011', '0110111', '0001011'];
        const EAN_G = ['0100111', '0110011', '0011011', '0100001', '0011101', '0111001', '0000101', '0010001', '0001001', '0010111'];
        const EAN_R = ['1110010', '1100110', '1101100', '1000010', '1011100', '1001110', '1010000', '1000100', '1001000', '1110100'];
        const EAN_P = ['LLLLLL', 'LLGLGG', 'LLGGLG', 'LLGGGL', 'LGLLGG', 'LGGLLG', 'LGGGLL', 'LGLGLG', 'LGLGGL', 'LGGLGL'];
        function ean13check(b) { let s = 0; for (let i = 0; i < 12; i++) s += (+b[i]) * (i % 2 ? 3 : 1); return (10 - s % 10) % 10; }
        function newBarcode() { const c = ++DB.settings.counters.bc; const b = '2260' + String(c).padStart(8, '0'); return b + ean13check(b); }
        function eanSVG(code, h = 46) {
            if (!/^\d{13}$/.test(code)) return `<div style="font:11px monospace;text-align:center">${esc(code)}</div>`;
            const f = +code[0]; let bits = '101';
            for (let i = 0; i < 6; i++) bits += (EAN_P[f][i] === 'L' ? EAN_L : EAN_G)[+code[i + 1]];
            bits += '01010';
            for (let i = 0; i < 6; i++) bits += EAN_R[+code[i + 7]];
            bits += '101';
            let r = '';
            for (let i = 0; i < bits.length; i++) if (bits[i] === '1') { let j = i; while (bits[j] === '1') j++; r += `<rect x="${i + 9}" y="0" width="${j - i}" height="${h}"/>`; i = j - 1; }
            return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 113 ${h + 12}" style="width:100%;display:block"><g fill="#000">${r}</g><text x="56.5" y="${h + 10}" font-size="9" text-anchor="middle" font-family="monospace">${code}</text></svg>`;
        }
        /* ---------- Code 128 (الباركود = SKU) ---------- */
        const C128 = ['212222', '222122', '222221', '121223', '121322', '131222', '122213', '122312', '132212', '221213', '221312', '231212', '112232', '122132', '122231', '113222', '123122', '123221', '223211', '221132', '221231', '213212', '223112', '312131', '311222', '321122', '321221', '312212', '322112', '322211', '212123', '212321', '232121', '111323', '131123', '131321', '112313', '132113', '132311', '211313', '231113', '231311', '112133', '112331', '132131', '113123', '113321', '133121', '313121', '211331', '231131', '213113', '213311', '213131', '311123', '311321', '331121', '312113', '312311', '332111', '314111', '221411', '431111', '111224', '111422', '121124', '121421', '141122', '141221', '112214', '112412', '122114', '122411', '142112', '142211', '241211', '221114', '413111', '241112', '134111', '111242', '121142', '121241', '114212', '124112', '124211', '411212', '421112', '421211', '212141', '214121', '412121', '111143', '111341', '131141', '114113', '114311', '411113', '411311', '113141', '114131', '311141', '411131', '211412', '211214', '211232', '2331112'];
        function c128SVG(text, hmm = 9) {
            const codes = [104]; let sum = 104;
            [...String(text ?? '')].forEach((ch, i) => { let c = ch.charCodeAt(0) - 32; if (c < 0 || c > 94) c = 13; codes.push(c); sum += c * (i + 1); });
            codes.push(sum % 103, 106);
            let x = 10, r = '';
            codes.forEach(c => { const p = C128[c]; for (let i = 0; i < p.length; i++) { const w = +p[i]; if (i % 2 === 0) r += `<rect x="${x}" y="0" width="${w}" height="10"/>`; x += w; } });
            return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${x + 10} 10" preserveAspectRatio="none" style="width:100%;height:${hmm}mm;display:block"><g fill="#000">${r}</g></svg>`;
        }
        const bcOf = v => v.sku || v.barcode || '';
        function newSku() {
            let s; do { s = 'T' + String(++DB.settings.counters.bc).padStart(5, '0'); } while (DB.products.some(p => p.variants.some(v => v.sku === s || v.barcode === s)));
            return s;
        }

        /* ---------- إعدادات ملصق الباركود ---------- */
        const LBL_NAMES = { name: 'اسم المنتج', color: 'اللون', seg: 'القسم', size: 'المقاس', price: 'السعر', barcode: 'الباركود', sku: 'SKU', style: 'Style', store: 'اسم المحل' };
        const LABEL_DEF = () => ({
            w: 50, h: 30, fs: 9, bh: 9, items: [
                { k: 'name', on: true, full: true }, { k: 'color', on: true, full: false }, { k: 'seg', on: true, full: false },
                { k: 'size', on: true, full: false }, { k: 'price', on: true, full: false }, { k: 'barcode', on: true, full: true },
                { k: 'sku', on: true, full: false }, { k: 'style', on: true, full: false }, { k: 'store', on: false, full: true }]
        });
        function labelCfg() { const s = S(); if (!s.label) s.label = LABEL_DEF(); return s.label; }
        /* ---------- logo ---------- */
        function logoHTML(cls = 'h-12') {

        }

        /* ================= DATA ================= */
        const PERMS = [['dashboard', 'لوحة التحكم'], ['pos', 'نقطة البيع'], ['products', 'المنتجات'], ['stock', 'المخزون'], ['invoices', 'الفواتير'], ['customers', 'العملاء'], ['returns', 'المرتجعات والاستبدال'],
        ['orders', 'الطلبات الأونلاين'], ['reports', 'التقارير'], ['landing', 'عرض اللاندنج'], ['landingAdmin', 'تحكم اللاندنج'], ['users', 'المستخدمون والصلاحيات'], ['settings', 'الإعدادات']];
        const ACTIONS = [['discount', 'تطبيق خصم'], ['editPrice', 'تعديل الأسعار'], ['delete', 'حذف منتجات/مستخدمين'], ['cost', 'رؤية التكلفة والأرباح'], ['refund', 'تنفيذ مرتجع/استبدال']];
        const PAY_ICON = { cash: '💵', wallet: '📱', bank: '🏦', instapay: '🏦', onlinepayment: '🏦' };
        const BANK_SUB = [['instapay', 'انستا باي', '⚡'], ['visa', 'فيزا', '💳']];
        const subLabel = k => k === 'direct' ? 'دفع مباشر' : (BANK_SUB.find(x => x[0] === k) || [0, ''])[1];
        const BANK_KEYS = ['bank', 'onlinepayment', 'instapay'];
        const isBankPay = m => BANK_KEYS.includes(m);

        /* ---------- metrics ---------- */
        function metrics(from, to) {
            const inR = d => { const k = ymd(d); return k >= from && k <= to; };
            const invs = DB.invoices.filter(i => inR(i.date)), rets = DB.returns.filter(r => inR(r.date));
            let gross = 0, profit = 0, items = 0, rev = 0, cost = 0, disc = 0, tax = 0; const byPay = {}, prod = {}, cashier = {};
            const P = it => (prod[it.pid] = prod[it.pid] || { name: it.name, pid: it.pid, qty: 0, rev: 0, ret: 0, profit: 0, rx: 0, cs: 0 });
            invs.forEach(i => {
                gross += i.total; disc += i.discount || 0; tax += i.tax || 0;
                byPay[i.pay.method] = (byPay[i.pay.method] || 0) + i.total;
                const c = (cashier[i.cashier] = cashier[i.cashier] || { n: 0, t: 0 }); c.n++; c.t += i.total;
                i.items.forEach(it => {
                    const s = it.netEx * it.qty, k = it.cost * it.qty;
                    items += it.qty; rev += s; cost += k; profit += s - k;
                    const x = P(it); x.qty += it.qty; x.rev += it.net * it.qty; x.profit += s - k; x.rx += s; x.cs += k;

                if (r.settle.dir === 'refund') byPay[r.settle.method] = (byPay[r.settle.method] || 0) - r.settle.amount;

                if (DB.products.some(p => p.id !== EP.id && p.variants.some(x => x.barcode === v.barcode))) return toast('الباركود مستخدم في منتج آخر: ' + v.barcode, 'err');
            }

            for (const v of EP.variants) {
                if (!v.sku) continue; const k = v.sku.toLowerCase();

            else { EP.id = 'p' + uid(); EP.variants.forEach(v => { if (v.qty > 0) logMove(EP, v, v.qty, 'open', 'منتج جديد'); }); DB.products.push(EP); }

        /* ================= STOCK ================= */

            }).join('') || `<tr><td colspan="6">${empty('لا توجد أصناف')}</td></tr>`}</tbody></table></div>`;
        }

                const n = +v;

        ACT.retPickInv = () => {
            modal('اختيار فاتورة', `<div class="space-y-1.5 max-h-[60vh] overflow-y-auto">${DB.invoices.slice(0, 6).map(i => `<button data-action="retPick" data-id="${i.id}" class="w-full flex items-center gap-3 p-2.5 rounded-xl border border-sand/40 hover:bg-sand/20 text-start"><b>${i.id}</b><span class="text-xs text-stone-500 flex-1">${fdate(i.date)} ${i.customer.name ? '• ' + esc(i.customer.name) : ''}</span><b class="text-cocoa">${money(i.total)}</b></button>`).join('')}</div>`);
        };
        ACT.retPick = t => { closeTopModal(); retLoad(t.dataset.id); };
        function retCalc() {
            const inv = DB.invoices.find(i => i.id === RET.invId), rm = returnedMap(inv.id); let rt = 0; const items = [];
            inv.items.forEach(it => { const q = Math.min(RET.qty[it.vid] || 0, it.qty - (rm[it.vid] || 0)); if (q > 0) { items.push({ ...it, qty: q }); rt += it.net * q; } });
            const tr = S().taxRate; let nt = 0; if (RET.type === 'exchange') RET.newItems.forEach(n => { nt += (n.price * n.qty - newLineDisc(n)) * (1 + tr / 100); });
            rt = Math.round(rt * 100) / 100; nt = Math.round(nt * 100) / 100; return { inv, rm, items, rt, nt, diff: Math.round((nt - rt) * 100) / 100 };
        }
        function renderRet() {
            const box = $('#retBody'); if (!box) return; if (!RET) { box.innerHTML = ''; return; }
            const c = retCalc(), inv = c.inv, st = invStatus(inv), pays = enabledPays(); if (!RET.method) RET.method = pays[0];
            box.innerHTML = `<div class="card p-4 space-y-4"><div class="flex flex-wrap items-center justify-between gap-2"><h3 class="font-extrabold text-cocoa title">2) المنتجات المراد إرجاعها — ${inv.id}</h3><span class="badge ${st[1]}">${st[0]}</span></div>
    <div class="text-xs text-stone-500">${fdate(inv.date)} • ${esc(inv.customer.name || 'عميل بدون اسم')} • إجمالي الفاتورة ${money(inv.total)}</div>
    <div class="overflow-x-auto"><table class="w-full min-w-[620px]"><thead><tr><th class="th">الصنف</th><th class="th">مباع</th><th class="th">سبق إرجاعه</th><th class="th">سعر الوحدة (بعد الخصم)</th><th class="th">كمية الإرجاع</th></tr></thead><tbody>
    ${inv.items.map(it => {
                const av = it.qty - (c.rm[it.vid] || 0); return `<tr><td class="td"><b>${esc(it.name)}</b><div class="text-[11px] text-stone-400">${esc(it.label)}</div></td><td class="td">${it.qty}</td><td class="td">${c.rm[it.vid] || 0}</td><td class="td">${money(it.net)}</td>
    <td class="td"><input type="number" min="0" max="${av}" ${av <= 0 ? 'disabled' : ''} class="inp !w-24" value="${RET.qty[it.vid] || 0}" data-oninput="retQty" data-vid="${it.vid}" data-max="${av}"></td></tr>`;
            }).join('')}</tbody></table></div>
    <div class="flex gap-2"><button class="btn btn-soft btn-sm" data-action="retAll">إرجاع الفاتورة بالكامل</button><button class="btn btn-ghost btn-sm" data-action="retNone">تصفير</button></div>

      <button data-action="retType" data-t="return" class="rounded-xl border-2 p-3 text-start ${RET.type === 'return' ? 'border-cocoa bg-cocoa/5' : 'border-sand/60'}"><div class="font-bold">↩️ إرجاع واسترداد</div><div class="text-xs text-stone-500">رد قيمة القطع للعميل</div></button>

        ACT.retAll = () => { const inv = DB.invoices.find(i => i.id === RET.invId), rm = returnedMap(inv.id); inv.items.forEach(it => { RET.qty[it.vid] = it.qty - (rm[it.vid] || 0); }); renderRet(); };

        ACT.retReason = t => { RET.reason = t.value; };
        ACT.retMethod = t => { RET.method = t.value; RET.bank = ''; RET.sub = ''; updRetSum(); };
        ACT.retBank = t => { RET.bank = t.value; RET.sub = ''; updRetSum(); };

        ACT.retAddNew = () => pickVariant((p, v) => {

            else RET.newItems.push({ pid: p.id, vid: v.id, name: p.name, label: vlabel(v), qty: 1, price: p.price, cost: p.cost, netEx: p.price, net: p.price * (1 + tr / 100) });

        ACT.retNewQty = t => { const n = RET.newItems[+t.dataset.i], f = findVariant(n.vid); let q = Math.max(1, Math.floor(num(t.value))); if (f && q > f.v.qty) { q = f.v.qty; t.value = q; toast('المتاح ' + q + ' فقط', 'warn'); } n.qty = q; updRetSum(); };

        // يتحقق من العملية ويبني سجل المرتجع/الاستبدال. commit=false → معاينة فقط (بدون حفظ ولا زيادة عداد)
        function retBuild(commit, askDays) {
            if (!can('refund')) { toast('لا تملك صلاحية تنفيذ المرتجعات', 'err'); return null; }

            if (RET.type === 'exchange' && !RET.newItems.length) { toast('أضيفي القطع البديلة', 'warn'); return null; }

            }

            }).join('')}</div>`;
        }

        function shipLabelHTML(o) {

        async function fbUpsertAuth(id, oldPin, pin) {
    const app2 = firebase.apps.find(a => a.name === 'second') || firebase.initializeApp(FB_CONFIG, 'second');
    const a = app2.auth(), c = fbCred(id, pin);
    try {
        if (oldPin && oldPin !== pin) {                       // نفس المعرّف وPIN اتغيّر: حدّث الباسورد
            const oc = fbCred(id, oldPin); let ok = false;
            try { await a.signInWithEmailAndPassword(oc.email, oc.pass); await a.currentUser.updatePassword(c.pass); ok = true; } catch (e) { }
            if (ok) return;
            try { await a.signOut(); } catch (e) { }
        }
        try { await a.createUserWithEmailAndPassword(c.email, c.pass); }
        catch (e) {
            if (e.code !== 'auth/email-already-in-use') throw e;
            try { await a.signInWithEmailAndPassword(c.email, c.pass); }   // موجود وباسورده مظبوط
            catch (e2) { const er = new Error('pw'); er.code = 'الحساب موجود في Firebase بباسورد مختلف — ادخل بيه مرة وهيتظبط تلقائي'; throw er; }
        }
    } finally { try { await a.signOut(); } catch (e) { } }
}

let USR_BUSY = false;
ACT.userSave = async t => {
    if (USR_BUSY) return;
    const g = id => $('#' + id).value.trim(), id = t.dataset.id, name = g('us_name'), un = toLatin(g('us_user')), pin = toLatin(g('us_pin'));
    if (!name || !un) return toast('أكمل الاسم ومعرّف الدخول', 'err');
    if (!/^\d{4,}$/.test(pin)) return toast('الرقم السري 4 أرقام على الأقل', 'err');
    if (DB.users.some(u => u.id !== id && userLogins(u).includes(loginId(un)))) return toast('المعرّف مستخدم بالفعل', 'err');
    const act = $('#us_act').checked, role = g('us_role');
    if (id) {
        const u = DB.users.find(x => x.id === id);
        if (u.role === 'owner' && (role !== 'owner' || !act) && DB.users.filter(x => x.role === 'owner' && x.active).length <= 1) return toast('لازم يبقى مالك نشط واحد على الأقل', 'err');
    }
    USR_BUSY = true;
    try {
        const old = id ? DB.users.find(x => x.id === id) : null;
        if (FBS.on && FBS.ready) {
            const ids = [...new Set([un, old && old.phone].map(x => loginId(x || '')).filter(Boolean))];
            try { for (const i of ids) await fbUpsertAuth(i, old && old.pin, pin); }
            catch (e) { console.error(e); return toast('تعذر تحديث حساب الدخول: ' + (e.code || e.message), 'err'); }
        }
        if (old) { Object.assign(old, { name, username: un, pin, role, active: act }); if (old.id === USER.id) USER = old; }
        else DB.users.push({ id: 'u' + uid(), name, username: un, pin, role, active: act });
        save();
        if (FBS.on && FBS.ready) { clearTimeout(FBS.timer); await fbPush(); }   // نضمن الحفظ قبل ما تقفلي الصفحة
        closeTopModal(); renderSide(); renderView(); toast('تم الحفظ');
    } finally { USR_BUSY = false; }
};

        /* ---- أرصدة وحركات البنك ---- */
        function bankStats() {
            const st = {}; DB.banks.forEach(b => { st[b.id] = { b, open: num(b.opening), sales: 0, refunds: 0, dep: 0, wd: 0, bal: 0 }; });
            let unk = 0;
            DB.invoices.forEach(i => { if (i.pay.method === 'cash') return; const x = st[i.pay.bank]; if (x) x.sales += i.total; else unk += i.total; });
            DB.returns.forEach(r => {
                const s = r.settle; if (!s || s.dir === 'even' || s.method === 'cash') return;
                const x = st[s.bank];
                if (x) { if (s.dir === 'pay') x.sales += s.amount; else x.refunds += s.amount; } else unk += (s.dir === 'pay' ? 1 : -1) * s.amount;
            });
            DB.bankTx.forEach(t => { const x = st[t.bank]; if (!x) return; if (t.type === 'in') x.dep += t.amount; else x.wd += t.amount; });
            const list = Object.values(st); list.forEach(x => { x.bal = x.open + x.sales - x.refunds + x.dep - x.wd; });
            return { list, unk };
        }
        function bankMoves(from, to) {
            const inR = d => { const k = ymd(d); return k >= from && k <= to; }, L = [];
            DB.invoices.forEach(i => { if (i.pay.method !== 'cash' && i.pay.bank && inR(i.date)) L.push({ date: i.date, bank: i.pay.bank, amt: i.total, label: 'فاتورة ' + i.id }); });
            DB.returns.forEach(r => { const s = r.settle; if (s && s.dir !== 'even' && s.method !== 'cash' && s.bank && inR(r.date)) L.push({ date: r.date, bank: s.bank, amt: s.dir === 'pay' ? s.amount : -s.amount, label: (r.type === 'exchange' ? 'استبدال ' : 'مرتجع ') + r.id }); });
            DB.bankTx.forEach(t => { if (inR(t.date)) L.push({ date: t.date, bank: t.bank, amt: t.type === 'in' ? t.amount : -t.amount, label: (t.type === 'in' ? 'إيداع' : 'سحب') + (t.note ? ' — ' + t.note : ''), id: t.id }); });
            return L.sort((a, b) => b.date.localeCompare(a.date));
        }
        function bankMovesHTML(from, to) {
            const L = bankMoves(from, to);
            return `<div class="card overflow-x-auto mt-4"><div class="px-4 py-3 border-b border-sand/30 flex flex-wrap gap-2 justify-between items-center"><h3 class="font-extrabold text-cocoa title">حركة الحسابات خلال الفترة</h3>
    <div class="flex gap-2"><button class="btn btn-soft btn-sm" data-action="bankTxNew" data-t="in">＋ إيداع</button><button class="btn btn-soft btn-sm" data-action="bankTxNew" data-t="out">− سحب</button></div></div>
  <table class="w-full min-w-[560px]"><thead><tr><th class="th">التاريخ</th><th class="th">الحساب</th><th class="th">البيان</th><th class="th">المبلغ</th><th class="th"></th></tr></thead><tbody>
  ${L.slice(0, 200).map(m => `<tr><td class="td text-xs">${fdate(m.date)}</td><td class="td">${esc(bankById(m.bank) ? bankById(m.bank).name : '—')}</td><td class="td text-xs">${esc(m.label)}</td><td class="td font-bold ${m.amt >= 0 ? 'text-emerald-600' : 'text-red-500'}">${m.amt >= 0 ? '+' : '−'} ${money(Math.abs(m.amt))}</td><td class="td">${m.id ? `<button class="btn btn-danger btn-sm" data-action="bankTxDel" data-id="${m.id}">✕</button>` : ''}</td></tr>`).join('') || `<tr><td colspan="5">${empty('لا توجد حركات في هذه الفترة')}</td></tr>`}</tbody></table></div>`;

    <div><label class="lbl">الحساب</label><select id="bt_bank" class="inp">${bankOpts('')}</select></div>

    <div><label class="lbl">ملاحظة</label><input id="bt_note" class="inp" placeholder="${inn ? 'مثال: إيداع كاش من الدرج' : 'مثال: دفع للمورّد'}"></div></div>`,
                { size: 'sm', footer: `<button class="btn btn-primary" data-action="bankTxSave" data-t="${t.dataset.t}">حفظ</button>` });

            DB.bankTx.unshift({ id: 'bt' + uid(), date: new Date().toISOString(), bank: $('#bt_bank').value, type: t.dataset.t, amount: amt, note: $('#bt_note').value.trim(), user: USER.name });
            save(); closeTopModal(); renderView(); toast('تم تسجيل الحركة');
        };
        ACT.bankTxDel = t => { if (!confirm('حذف الحركة؟')) return; DB.bankTx = DB.bankTx.filter(x => x.id !== t.dataset.id); save(); renderView(); };
        ACT.posBank = t => { POS.bank = t.value; };
        /* ================= POS TICKETS (أكتر من عميل مع بعض) ================= */
        const TK_MAX = 8;

        function tkSave() { if (!POS.ready) return; const o = {}; Object.keys(tkBlank()).forEach(k => { o[k] = POS[k]; }); POS.tabs[POS.cur] = o; }
        function tkLoad(i) { POS.cur = i; Object.assign(POS, tkBlank(), POS.tabs[i]); POS.cart = POS.cart.filter(c => findVariant(c.vid)); }

        ACT.posBankPick = t => { POS.bank = t.dataset.id; renderCart(); };
        ACT.posSub = t => { POS.sub = t.dataset.s; renderCart(); };
        let DRW = { bank: '' };

        function drwRender() {
            const b = $('#drwBody'); if (!b) return;
            const list = activeBanks(), cur = bankById(DRW.bank);

    ${cur ? `<label class="lbl mt-5">طريقة الدفع</label>
    <div class="grid grid-cols-2 gap-2">${BANK_SUB.filter(([k]) => bankSubs(cur).includes(k)).map(([k, l]) => `<button data-action="drwSub" data-s="${k}" class="rounded-xl border-2 border-sand/60 py-4 text-sm font-bold hover:border-cocoa hover:bg-cocoa/5 transition">${l}</button>`).join('')}</div>` : ''}`;
        }

        ACT.drwCopy = t => {
            const v = t.dataset.v;

        ACT.payToggle = t => {

        ACT.payAdd = () => {
            modal('إضافة طريقة دفع', '<label class="lbl">اسم الطريقة</label><input id="pa_name" class="inp" placeholder="مثال: فودافون كاش"><label class="lbl mt-3">ملاحظة / رقم</label><input id="pa_note" class="inp">', { size: 'sm', footer: '<button class="btn btn-primary" data-action="paySave">إضافة</button>' });

            return `<div><label class="lbl">الحساب البنكي</label><select id="pdBank" class="inp" data-onchange="pdBankSel">${L.map(b => `<option value="${b.id}">${esc(b.name)}${b.bank ? ' — ' + esc(b.bank) : ''}</option>`).join('')}</select></div>

            'auth/invalid-credential': 'المعرّف أو الرقم السري غلط (أو الحساب لسه متزامنش — المالك يدوس "مزامنة حسابات الدخول")',
            'auth/user-not-found': 'الحساب مش موجود — المالك يدوس "مزامنة حسابات الدخول"',
            'auth/wrong-password': 'الرقم السري غلط',
            'auth/invalid-email': 'المعرّف غير صالح',
            'auth/user-disabled': 'الحساب موقوف',
            'auth/too-many-requests': 'محاولات كتير — استنى شوية وجرّب تاني',
            'auth/operation-not-allowed': 'Email/Password مش مفعّل في Firebase',
            'auth/network-request-failed': 'مشكلة في الاتصال بالإنترنت'
        }[e.code] || ('خطأ: ' + (e.code || e.message)), 'err');
    }
};
        const profileFor = au => au && DB.users.find(x => x.active &&
            [x.username, x.phone].some(v => v && fbCred(v, '').email === au.email));

        /* ================= CASH DRAWER (ESC/POS عبر Web Serial) ================= */
        const DRW_KEY = 'tiana_drawer';
        const DRAWER_CMD = new Uint8Array([0x1B, 0x70, 0x00, 0x19, 0xFA]);   // لو الدرج مفتحش جرّب 0x1B,0x70,0x01,0x19,0xFA
        async function drawerKick(manual) {
            try {
                if (!manual && localStorage.getItem(DRW_KEY) !== '1') return;
                if (!('serial' in navigator)) return manual && toast('استخدم Chrome أو Edge', 'err');
                const ports = await navigator.serial.getPorts();
                if (!ports.length) return toast('الدرج مش مربوط — اربطه من الإعدادات', 'warn');
                await ports[0].open({ baudRate: 9600 });
                const w = ports[0].writable.getWriter(); await w.write(DRAWER_CMD); w.releaseLock();
                await ports[0].close();
                if (manual) toast('تم إرسال أمر الفتح');
            } catch (e) { console.error(e); toast('تعذر فتح الدرج — تأكد من المنفذ', 'warn'); }
        }
        ACT.drawerPair = async () => {
            if (!('serial' in navigator)) return toast('استخدم Chrome أو Edge', 'err');
            try {
                for (const p of await navigator.serial.getPorts()) { try { await p.forget(); } catch (e) { } }
                await navigator.serial.requestPort();
                localStorage.setItem(DRW_KEY, '1'); toast('تم ربط الدرج ✅');
            } catch (e) { /* المستخدم لغى */ }
        };
        ACT.drawerTest = () => drawerKick(true);
        ACT.drawerOff = () => { localStorage.removeItem(DRW_KEY); toast('تم إيقاف فتح الدرج التلقائي'); };
        async function init() {
            $('#loginView').classList.remove('hidden');
            $('#loginView').innerHTML = '<div class="min-h-full flex items-center justify-center text-stone-500 font-bold p-10">جاري التحميل</div>';
            fbInit(); const local = loadDB();
            let u = null;
            if (FBS.on) {
                try {
                    await withTimeout(fbAuthGate(), 600000);
                    const au = firebase.auth().currentUser;
                    const D = await withTimeout(fbLoad());
                    if (D) { DB = D; migrate(); }
                    else {                                   // أول تشغيل: Firestore فاضي
                        DB = local; if (!DB) seed(); migrate();
                        if (!profileFor(au)) {
    const id = PENDING ? PENDING.id : au.email.replace('@tiana.app', '');
    DB.users = [{ id: 'u1', name: id, username: id, pin: PENDING ? PENDING.pin : '', role: 'owner', active: true }];
}
                    }
                    FBS.ready = true;
                    if (!D) fbPush();
                    fbListen(); fbSchedule();
                    u = profileFor(au);
if (u && PENDING && PENDING.pin && u.pin !== PENDING.pin) { u.pin = PENDING.pin; save(); }
PENDING = null;
if (!u) {
    toast('الحساب ده مش مسجّل كمستخدم نشط في النظام — تواصل مع المالك', 'err');
    await firebase.auth().signOut(); setTimeout(() => location.reload(), 2500); return;
}
} catch (e) {
                    console.error(e); DB = local; if (!DB) seed(); migrate(); FBS.ready = false;
                    toast('تعذر الاتصال بـ Firebase: ' + (e.code || e.message), 'err');
                }
            } else { DB = local; if (!DB) seed(); else migrate(); }

            if (u) { USER = u; enterApp(); }
            else if (!FBS.ready) showLogin();                // وضع الأوفلاين فقط
            setSync(FBS.ready ? 'ok' : 'off');
        }

        /* ================= DESKTOP SHORTCUT (بدون تثبيت المتصفح) ================= */
        const scU16 = s => { const b = new Uint8Array(s.length * 2); for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); b[i * 2] = c & 255; b[i * 2 + 1] = c >> 8; } let r = ''; b.forEach(x => r += String.fromCharCode(x)); return btoa(r); };
        const scB64 = u8 => { let r = ''; for (let i = 0; i < u8.length; i += 8192) r += String.fromCharCode.apply(null, u8.subarray(i, i + 8192)); return btoa(r); };

        async function scIcon(size = 128) {
            const src = (DB && DB.settings.logo) || 'icon-512.png';
            const im = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
            const c = document.createElement('canvas'); c.width = c.height = size; const x = c.getContext('2d');
            x.beginPath(); x.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2); x.clip();
            x.fillStyle = '#fff'; x.fillRect(0, 0, size, size);
            const k = Math.max(size / im.width, size / im.height);
            x.drawImage(im, (size - im.width * k) / 2, (size - im.height * k) / 2, im.width * k, im.height * k);
            const png = new Uint8Array(await (await new Promise(r => c.toBlob(r, 'image/png'))).arrayBuffer());
            const h = new DataView(new ArrayBuffer(22));
            h.setUint16(2, 1, true); h.setUint16(4, 1, true);
            h.setUint8(6, size); h.setUint8(7, size);
            h.setUint16(10, 1, true); h.setUint16(12, 32, true); h.setUint32(14, png.length, true); h.setUint32(18, 22, true);
            const out = new Uint8Array(22 + png.length); out.set(new Uint8Array(h.buffer)); out.set(png, 22);
            return out;
        }

        ACT.scOpen = () => modal('🖥️ تنزيل', `<div class="space-y-3">
    <div class="text-sm text-stone-600 leading-7">هينزل ملف صغير تشغّله مرة واحدة على الكمبيوتر، فيعمل اختصار على سطح المكتب بالأيقونة الدايرية ويفتح النظام في نافذة مستقلة. تقدر تنزّله وتشغّله أكتر من مرة.</div>
    <div><label class="lbl">اسم الاختصار</label><input id="sc_name" class="inp" value="Tiana Kids & More"></div>
    <label class="flex items-start gap-2 text-sm"><input type="checkbox" id="sc_sep" class="accent-[#87624C] mt-1"> <span>نافذة بجلسة مستقلة (لو هتفتح أكتر من نسخة بحسابات مختلفة في نفس الوقت. كل نسخة هتحتاج تسجيل دخول مرة واحدة)</span></label>
  </div>`, { size: 'sm', footer: '<button class="btn btn-primary" data-action="scDownload">⬇️ تحميل</button>' });

        ACT.scDownload = async () => {
            const name = ($('#sc_name').value.replace(/[\\/:*?"<>|']/g, '').trim()) || 'Tiana', sep = $('#sc_sep').checked;
            const url = location.href.split('#')[0].replace(/'/g, '');
            let ico; try { ico = await scIcon(128); } catch (e) { return toast('تعذر تحميل الأيقونة — تأكد من وجود icon-512.png', 'err'); }
            const ps = [
                `$ErrorActionPreference='Stop'`,
                `$dir=Join-Path $env:APPDATA 'TianaApp'; New-Item -ItemType Directory -Force $dir | Out-Null`,
                `$ico=Join-Path $dir 'icon.ico'`,
                `$t=Join-Path $env:TEMP 'tiana_icon.b64'`,
                `[IO.File]::WriteAllBytes($ico,[Convert]::FromBase64String(((Get-Content -Raw $t) -replace '\\s','')))`,
                `$b=@("$env:ProgramFiles\\Google\\Chrome\\Application\\chrome.exe","\${env:ProgramFiles(x86)}\\Google\\Chrome\\Application\\chrome.exe","$env:LOCALAPPDATA\\Google\\Chrome\\Application\\chrome.exe","\${env:ProgramFiles(x86)}\\Microsoft\\Edge\\Application\\msedge.exe","$env:ProgramFiles\\Microsoft\\Edge\\Application\\msedge.exe")|?{Test-Path $_}|select -First 1`,
                `if(-not $b){throw 'Chrome or Edge not found'}`,
                `$name='${name}'`,
                `$ar='--app=${url} --kiosk-printing'`,
                sep ? `$ar+=' --user-data-dir="'+(Join-Path $env:LOCALAPPDATA ('TianaApp\\'+$name))+'"'` : '',
                `$s=(New-Object -ComObject WScript.Shell).CreateShortcut((Join-Path ([Environment]::GetFolderPath('Desktop')) ($name+'.lnk')))`,
                `$s.TargetPath=$b; $s.Arguments=$ar; $s.IconLocation=$ico; $s.Save()`
            ].filter(Boolean).join('\n');
            const lines = scB64(ico).match(/.{1,76}/g);
            const bat = ['@echo off', 'set "T=%TEMP%\\tiana_icon.b64"', 'if exist "%T%" del "%T%"']
                .concat(lines.map(l => `>>"%T%" echo ${l}`))
                .concat([`powershell -NoProfile -ExecutionPolicy Bypass -EncodedCommand ${scU16(ps)}`,
                    'if errorlevel 1 (echo Failed - Chrome or Edge is required) else (echo Done - shortcut created on your Desktop)',
                    'del "%T%" 2>nul', 'pause']).join('\r\n');
            download('tiana-shortcut.bat', bat, 'application/octet-stream');
            closeTopModal(); toast('اتحمّل الملف — شغّله بدبل كليك');
        };
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
        init();
        ACT.resetAll = async () => {
            if (!confirm('سيتم مسح كل البيانات (المنتجات والفواتير والطلبات...) محلياً وعلى Firebase والبدء بنظام فاضي. متأكد؟')) return;
            try { if (FBS.on && FBS.ready) await fbWipe(); localStorage.removeItem(KEY); sessionStorage.clear(); } catch (e) { }
            location.reload();
        };
    </script>
</body>
