        const lastInvId = () => DB.invoices.reduce((best, i) => {

        function showInvoice(id) {
            const inv = DB.invoices.find(i => i.id === id); if (!inv) return;
            const canDel = USER && USER.role === 'owner' && id === lastInvId();
            modal('تفاصيل الفاتورة', invoiceHTML(inv), { footer: `<button class="btn btn-primary" data-action="invPrint" data-id="${id}">🖨️ طباعة</button>${can('returns') ? `<button class="btn btn-soft" data-action="invReturn" data-id="${id}">↩️ مرتجع / استبدال</button>` : ''}${canDel ? `<button class="btn btn-danger" data-action="invDelete" data-id="${id}">🗑️ حذف الفاتورة</button>` : ''}<button class="btn btn-ghost" data-action="closeModal">إغلاق</button>` });

        ACT.invDelete = t => {
            if (!USER || USER.role !== 'owner') return toast('حذف الفواتير للمالك فقط', 'err');
            const inv = DB.invoices.find(i => i.id === t.dataset.id); if (!inv) return;
            if (inv.id !== lastInvId()) return toast('الحذف متاح لآخر فاتورة فقط', 'err');
            const rets = DB.returns.filter(r => r.invId === inv.id);
            const order = DB.orders.find(o => o.invId === inv.id || (inv.channel === 'online' && o.id === inv.note));
            let msg = 'حذف الفاتورة ' + inv.id + ' نهائياً؟\nهيتم إرجاع الكميات للمخزون.';
            if (rets.length) msg += '\nوهيتم حذف ' + rets.length + ' مرتجع/استبدال مرتبطين بيها.';
            if (order) msg += '\nوالطلب ' + order.id + ' هيرجع "جديد" عشان تعيدي تأكيده.';
            if (!confirm(msg)) return;

            const net = {}; // صافي الكميات اللي لازم ترجع للمخزون
            const add = (vid, q) => { net[vid] = (net[vid] || 0) + q; };
            inv.items.forEach(i => add(i.vid, i.qty));                     // نلغي البيع
            rets.forEach(r => {
                r.items.forEach(i => add(i.vid, -i.qty));                  // نلغي رجوع المرتجع
                (r.newItems || []).forEach(n => add(n.vid, n.qty));        // نرجّع البدائل
            });
            Object.entries(net).forEach(([vid, q]) => {
                const f = findVariant(vid); if (f && q) moveStock(f.p, f.v, q, 'adjust', 'حذف ' + inv.id);
            });

            DB.returns = DB.returns.filter(r => r.invId !== inv.id);
            DB.invoices = DB.invoices.filter(i => i !== inv);

            S().counters.inv = DB.invoices.reduce((mx, i) => Math.max(mx, parseInt(String(i.id).split('-')[1], 10) || 0), 0);
            if (order) { order.status = 'new'; order.invId = ''; }

            const g = id => $('#' + id).value.trim(), name = g('ep_name'), price = num(g('ep_price'));
            if (!name) return toast('اكتبي اسم المنتج', 'err'); if (price <= 0) return toast('اكتبي سعر البيع', 'err');
            const codes = new Set();
            for (const v of EP.variants) {
                if (!v.barcode) v.barcode = newBarcode(); if (codes.has(v.barcode)) return toast('باركود مكرر: ' + v.barcode, 'err'); codes.add(v.barcode);
                if (DB.products.some(p => p.id !== EP.id && p.variants.some(x => x.barcode === v.barcode))) return toast('الباركود مستخدم في منتج آخر: ' + v.barcode, 'err');
            }
            const skus = new Set();
            for (const v of EP.variants) {
                if (!v.sku) continue; const k = v.sku.toLowerCase();
                if (skus.has(k)) return toast('SKU مكرر: ' + v.sku, 'err'); skus.add(k);
                if (DB.products.some(p => p.id !== EP.id && p.variants.some(x => (x.sku || '').toLowerCase() === k))) return toast('SKU مستخدم في منتج آخر: ' + v.sku, 'err');

ACT.userSave = async t => {
    const g = id => $('#' + id).value.trim(), id = t.dataset.id, name = g('us_name'), un = toLatin(g('us_user')), pin = toLatin(g('us_pin'));
    if (!name || !un) return toast('أكمل الاسم ومعرّف الدخول', 'err');
    if (!/^\d{4,}$/.test(pin)) return toast('الرقم السري 4 أرقام على الأقل', 'err');
    if (DB.users.some(u => u.id !== id && (u.username || '').toLowerCase() === un.toLowerCase())) return toast('المعرّف مستخدم بالفعل', 'err');
    const act = $('#us_act').checked, role = g('us_role');
    if (id) {
        const u = DB.users.find(x => x.id === id);
        if (u.role === 'owner' && (role !== 'owner' || !act) && DB.users.filter(x => x.role === 'owner' && x.active).length <= 1) return toast('لازم يبقى مالك نشط واحد على الأقل', 'err');
    }
    if (FBS.on) {
        try { await fbCreateAuth(un, pin); }
        catch (e) { console.error(e); return toast('تعذر إنشاء حساب الدخول: ' + e.code, 'err'); }
    }
    if (id) { const u = DB.users.find(x => x.id === id); Object.assign(u, { name, username: un, pin, role, active: act }); if (u.id === USER.id) USER = u; }
    else DB.users.push({ id: 'u' + uid(), name, username: un, pin, role, active: act });
    save(); closeTopModal(); renderSide(); renderView(); toast('تم الحفظ');
};

        function bankStats() {
            const st = {}; DB.banks.forEach(b => { st[b.id] = { b, open: num(b.opening), sales: 0, refunds: 0, dep: 0, wd: 0, bal: 0 }; });
            let unk = 0;
            DB.invoices.forEach(i => { if (i.pay.method === 'cash') return; const x = st[i.pay.bank]; if (x) x.sales += i.total; else unk += i.total; });

                const x = st[s.bank];

            });
            DB.bankTx.forEach(t => { const x = st[t.bank]; if (!x) return; if (t.type === 'in') x.dep += t.amount; else x.wd += t.amount; });
            const list = Object.values(st); list.forEach(x => { x.bal = x.open + x.sales - x.refunds + x.dep - x.wd; });
            return { list, unk };

                        if (d.doc.metadata.hasPendingWrites) return;
                        const x = d.doc.data(), k = c + '/' + d.doc.id, arr = DB[c], i = arr.findIndex(y => y.id === d.doc.id);
                        if (d.type === 'removed') { if (i >= 0) { arr.splice(i, 1); ch = true; } delete FBS.h[k]; return; }
                        const h = H(x); if (FBS.h[k] === h) return;
                        FBS.h[k] = h; if (i >= 0) arr[i] = x; else arr.push(x);
                        const n = parseInt(String(x.id).split('-')[1], 10), cn = DB.settings.counters;
                        if (c === 'invoices' && n > cn.inv) cn.inv = n;
                        if (c === 'orders' && n > cn.ord) cn.ord = n;
                        ch = true;
                    });
                    if (ch) {
                        if (['orders', 'invoices', 'bankTx'].includes(c)) arr_sort(DB[c]);
                        try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) { }
                        fbRefresh();
                    }
                }, e => console.error(e));
            });
        }
        const arr_sort = a => a.sort((x, y) => y.date.localeCompare(x.date));
        function fbRefresh() {
            if (!USER) return; renderSide();
            const busy = $('#modalRoot .modal') || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
            if (!busy && ['dashboard', 'orders', 'stock', 'products', 'invoices'].includes(PAGE)) renderView();
        }
        async function fbWipe() {
            for (const c of [...COLS, 'meta']) {
                const s = await FBS.db.collection(c).get(); let b = FBS.db.batch(), n = 0;
                for (const d of s.docs) { b.delete(d.ref); if (++n % 400 === 0) { await b.commit(); b = FBS.db.batch(); } }
                await b.commit();
            }
        }
        const withTimeout = (p, ms = 30000) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('Firebase timeout')), ms))]);
        let PENDING = null;
        const fbCred = (u, p) => {
            const id = toLatin(u).trim().toLowerCase().replace(/\s+/g, '');
            const safe = /^[a-z0-9._-]+$/.test(id)
                ? id
                : 'u' + [...new TextEncoder().encode(id)].map(b => b.toString(16).padStart(2, '0')).join('');
            return { email: safe + '@tiana.app', pass: toLatin(p).trim() + 'tiana' };
        };

        function fbAuthGate() {
            return new Promise(resolve => {
                const stop = firebase.auth().onAuthStateChanged(u => {
                    if (u) { stop(); resolve(); return; }
                    // Firebase رد وفعلاً مفيش مستخدم: اعرض شاشة الدخول
                    $('#loginView').classList.remove('hidden');
                    $('#loginView').innerHTML = `<div class="min-h-full flex items-center justify-center p-4"><div class="card w-full max-w-md p-7">
                    <div class="flex justify-center mb-2">${logoHTML('h-24')}</div>
                    <p class="text-center text-xs text-stone-500 mb-6">سجل الدخول للمتابعة</p>
                    <label class="lbl">رقم الموبايل او اسم المستخدم (ID)</label>
<input id="lgPhone" class="inp mb-3" dir="ltr" placeholder="مثال: mustafa" data-enter="fbSignIn">
                    <label class="lbl">الرقم السري</label>
                    <input id="lgPin" type="password" inputmode="numeric" class="inp mb-4" placeholder="••••" data-enter="fbSignIn">
                    <button data-action="fbSignIn" class="btn btn-primary w-full !py-3">دخول</button></div></div>`;
                });
            });
        }
        ACT.fbSignIn = async () => {
            const un = $('#lgPhone').value, pin = $('#lgPin').value;
            if (!un.trim() || !pin.trim()) return toast('اكتب اسم المستخدم والرقم السري', 'err');
            const c = fbCred(un, pin);
            PENDING = { un: toLatin(un).trim().toLowerCase(), pin: toLatin(pin).trim() };
            try {
                await firebase.auth().signInWithEmailAndPassword(c.email, c.pass);
            } catch (e) {
                PENDING = null; console.error(e);
                const m = {
                    'auth/invalid-credential': 'الحساب مش موجود في Firebase أو الباسورد غلط',
                    'auth/user-not-found': 'الحساب مش موجود في Firebase',
                    'auth/wrong-password': 'الرقم السري غلط',
                    'auth/operation-not-allowed': 'Email/Password مش مفعّل في Firebase',
                    'auth/network-request-failed': 'مشكلة في الاتصال بالإنترنت'
                }[e.code] || ('خطأ: ' + e.code);
                toast(m, 'err');
            }
        };

        async function init() {
            $('#loginView').classList.remove('hidden');
            $('#loginView').innerHTML = '<div class="min-h-full flex items-center justify-center text-stone-500 font-bold p-10">جاري التحميل</div>';
            fbInit(); const local = loadDB();
            if (FBS.on) {
                try {
                    await withTimeout(fbAuthGate(), 600000);
                    const D = await withTimeout(fbLoad());
                    if (D) { DB = D; migrate(); FBS.ready = true; }
                    else { DB = local; if (!DB) seed(); migrate(); FBS.ready = true; fbPush(); }
                    fbListen();
                    fbSchedule();
                } catch (e) {
                    console.error(e); DB = local; if (!DB) seed(); migrate(); FBS.ready = false;
                    toast('تعذر الاتصال بـ Firebase: ' + (e.code || e.message), 'err');
                }
            } else { DB = local; if (!DB) seed(); else migrate(); }
            let id = null; try { id = localStorage.getItem('tiana_u'); } catch (e) { }
            let u = id && DB.users.find(x => x.id === id && x.active);
            if (!u && PENDING) u = DB.users.find(x => x.active && ((x.username || '').toLowerCase() === PENDING.un || (x.phone && normPhone(x.phone) === normPhone(PENDING.un))) && x.pin === PENDING.pin);
            if (u) { USER = u; try { localStorage.setItem('tiana_u', u.id); } catch (e) { } enterApp(); } else showLogin();
            setSync(FBS.ready ? 'ok' : 'off');
        }

        /* ================= INSTALL (PWA) ================= */
        let DEFERRED_INSTALL = null;
        window.addEventListener('beforeinstallprompt', e => {
            e.preventDefault(); DEFERRED_INSTALL = e;
            const b = $('#installBtn'); if (b) b.classList.remove('hidden');
        });
        window.addEventListener('appinstalled', () => {
            DEFERRED_INSTALL = null;
            const b = $('#installBtn'); if (b) b.classList.add('hidden');
            toast('تم تثبيت التطبيق ✅');
        });
        ACT.installApp = async () => {
            if (!DEFERRED_INSTALL) return toast('التثبيت غير متاح الآن — جرّبي من قائمة المتصفح ⋮ ← Install', 'warn');
            DEFERRED_INSTALL.prompt();
            await DEFERRED_INSTALL.userChoice;
            DEFERRED_INSTALL = null;
            const b = $('#installBtn'); if (b) b.classList.add('hidden');
        };
        if (matchMedia('(display-mode: standalone)').matches) { const b = $('#installBtn'); if (b) b.classList.add('hidden'); }
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
        init();
        ACT.resetAll = async () => {
            if (!confirm('سيتم مسح كل البيانات (المنتجات والفواتير والطلبات...) محلياً وعلى Firebase والبدء بنظام فاضي. متأكد؟')) return;
            try { if (FBS.on && FBS.ready) await fbWipe(); localStorage.removeItem(KEY); sessionStorage.clear(); } catch (e) { }
            location.reload();
        };
    </script>
</body>

</html>
